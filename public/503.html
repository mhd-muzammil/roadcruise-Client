<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>503: Service Unavailable</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
  }
  main { padding: 24px; text-align: center; }
  .msg { font-size: 16px; font-weight: 500; line-height: 1.5; margin: 0; }
  .status {
    font-size: 13px;
    font-weight: 400;
    line-height: 1.5;
    margin: 10px 0 0;
    color: rgba(0, 0, 0, .55);
  }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #fff; }
    .status { color: rgba(255, 255, 255, .55); }
  }
</style>
</head>
<body>
  <main>
    <p class="msg">This page could not be found.</p>
    <p class="status">503 Service Unavailable</p>
  </main>
</body>
</html>
